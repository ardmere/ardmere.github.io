# Exchange upstream registry — canonical list of official PoR pages and GitHub repos.
# Consumed by: por exchanges, data guides, assessment references, exchange-comparison.
#
# Role vocabulary:
#   verifier_toolchain         — open-source verifier / circuit / CLI
#   global_zk_verifier_spec    — global ZK proof spec + implementation
#   address_ownership_verifier — wallet control signature verification
#   user_merkle_verifier       — user inclusion Merkle path verification (Gen 1)
#   sample_artifact_release    — sample period bundles on GitHub Releases only

version: 1
updated: "2026-11-06"

exchanges:
  - id: binance
    name: Binance
    porPage: https://www.binance.com/en/proof-of-reserves
    dataGuide: docs/binance-por-data-guide.md
    vcTier: 3
    upstreamRepos:
      - url: https://github.com/binance/zkmerkle-proof-of-solvency
        role: verifier_toolchain
        ardmereUse: global-zk-proof@0 (stub)
        note: Releases ship verifier binaries only; per-period proof.csv and vk are not permissionlessly published.
    integrationNotes: >-
      Public BAPI summary and wallet_address ZIP are permissionless; wallet_ownership_proof
      and global_proof/vk are missing from public channels (blocks Stage 1 / S1-5).

  - id: okx
    name: OKX
    porPage: https://www.okx.com/proof-of-reserves
    dataGuide: docs/okx-por-data-guide.md
    vcTier: 2
    upstreamRepos:
      - url: https://github.com/okx/proof-of-reserves
        role: address_ownership_verifier
        ardmereUse: address-ownership@okx-1
        note: Go module dependency; ETH address signature verification.
      - url: https://github.com/okx/proof-of-reserves-v2
        role: global_zk_verifier_spec
        ardmereUse: global-zk-proof@okx-1
        note: Plonky2 global zk; optional OKX_ZK_STARK_VALIDATOR binary from zk-por-cli.
    integrationNotes: >-
      Permissionless CDN artifacts for summary, wallet zip, and liability zip; Stage 1 reference in this set.

  - id: gateio
    name: Gate.io
    porPage: https://www.gate.com/proof-of-reserves
    dataGuide: docs/gate-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/gateio/proof-of-reserves
        role: verifier_toolchain
        ardmereUse: global-zk-proof@gateio-1 (planned)
        note: zk-SNARK verifier CLI; production zk bundle is login-gated on gate.com.
    integrationNotes: >-
      Public aggregate API only; no public wallet_address_list; zk bundle from My Audit requires login.

  - id: bybit
    name: Bybit
    porPage: https://www.bybit.com/en/proof-of-reserves
    dataGuide: docs/bybit-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/bybit-exchange/merkle-proof
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@bybit-1
        note: Java reference verifier; logic ported in internal/exchanges/bybit/merkle.
    integrationNotes: >-
      Summary is browser/WAF-gated; user Merkle proof is login-gated; no public wallet list or global ZK.

  - id: bitget
    name: Bitget
    porPage: https://www.bitget.com/proof-of-reserves
    dataGuide: docs/bitget-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/BitgetLimited/proof-of-reserves
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@bitget-1
        note: Java verifier; 64-bit truncated SHA-256 Merkle scheme; repo stale since ~2023.
    integrationNotes: >-
      No public wallet_address_list or global proof; weak truncated-hash user inclusion only.

  - id: htx
    name: HTX
    porPage: https://www.htx.com/zh-cn/finance/merkle/
    dataGuide: docs/htx-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/huobiapi/Tool-Go-MerkleVerify
        role: sample_artifact_release
        ardmereUse: global-zk-proof@htx-1
        note: >-
          Release 2.0.0 public-data.zip (2023-09-10 sample) + zkverifier binary;
          current production bundles are dashboard/login gated.
    integrationNotes: >-
      ardmere archives the 2023 sample zk bundle; no public wallet list or current-period permissionless global proof.

  - id: mexc
    name: MEXC
    porPage: https://www.mexc.com/support/article/how-to-verify-user-assets-on-mexc-17827791528836
    dataGuide: docs/mexc-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/mexcmerkle/mexc-merkle-proof-of-reserves
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@mexc-1
        note: Java reference verifier; SHA-256 truncated to 32 hex chars (128 bits); logic ported in internal/exchanges/mexc/merkle.
    integrationNotes: >-
      Summary JSON is WAF/login gated from datacenters; import press-release or browser capture.
      User Merkle proof is login-gated; no public wallet_address_list or global ZK.

  - id: kucoin
    name: KuCoin
    porPage: https://www.kucoin.com/proof-of-reserves
    dataGuide: docs/kucoin-por-data-guide.md
    vcTier: 1
    upstreamRepos: []
    integrationNotes: >-
      Public PoR page SSR (__NEXT_DATA__.initialReserve) exposes latest reserve ratios without login.
      User Merkle self-check is login-gated; no official OSS verifier repo found — user-merkle stays stubbed.
      No permissionless wallet_address_list or global ZK.

  - id: bingx
    name: BingX
    porPage: https://bingx.com/en/balance-reserve
    dataGuide: docs/bingx-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/BingX-API/BingX-proof-of-reserves
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@bingx-1
        note: Python por.py SHA-256 leaf/path verifier; logic ported in internal/exchanges/bingx/merkle.
    integrationNotes: >-
      Reserve JSON APIs return app security / device-time errors from datacenters; import support-article
      or browser capture. User Merkle leaf/path is login-gated; no public wallet list or global ZK.

  - id: poloniex
    name: Poloniex
    porPage: https://www.poloniex.com/topic/security/proof-of-reserves
    dataGuide: docs/poloniex-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/poloniex/tools-nodejs-address-verify
        role: address_ownership_verifier
        ardmereUse: address-ownership@0
        note: >-
          Node VerifyAddress for signed wallet CSV (message "poloniex"). Sample CSV in repo;
          current-period CSV has no stable permissionless download URL confirmed — ownership stays stubbed.
    integrationNotes: >-
      Public proxy/sapi endpoints expose versionInfo + snapshotBalance (ratios + full merkleHash) without login.
      User merkleProof.json is login-gated; MerkleVerify is announced as a downloadable binary, not an OSS
      source repo in the poloniex org — user-merkle stays stubbed. No public wallet_address_list or global ZK.
  - id: ourbit
    name: Ourbit
    porPage: https://www.ourbit.com/assets/reserve-proof
    dataGuide: docs/ourbit-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/OurbitOfficial/merkle_validate
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@ourbit-1
        note: >-
          Java reference verifier; SHA-256 truncated to 32 hex chars (128 bits);
          logic ported in internal/exchanges/ourbit/merkle.
    integrationNotes: >-
      Public stock_info + wallet_detail APIs expose ratios and a live multi-chain wallet table without login.
      User merkel_tree_ourbit.json and merkle list/download are login-gated. stock_info has no period merkle root.
      Live wallets lack ownership signatures and are not snapshot-bound — Stage 1 walletZip stays unwired.
  - id: coinex
    name: CoinEx
    porPage: https://www.coinex.com/en/reserve-proof
    dataGuide: docs/coinex-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/coinexcom/proof-of-reserves
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@coinex-1
        note: >-
          Official Go verifier (full SHA-256 leaf/path with balance aggregates);
          logic ported in internal/exchanges/coinex/merkle. Upstream example JSON
          currently fails self-check — ardmere uses a synthetic fixture for unit tests.
    integrationNotes: >-
      Public /res/account/balance/merkle/reserve exposes period ratios, root_hash, and
      wallet_proof_file (XLSX). User /res/account/balance/merkle/proof is login-gated.
      XLSX address dump has no ownership signatures — Stage 1 walletZip stays unwired.
      No global ZK / third-party attestation channel.
  - id: bitunix
    name: Bitunix
    porPage: https://www.bitunix.com/proof-of-reserve
    dataGuide: docs/bitunix-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/BitunixOfficial/proof-of-reserves
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@bitunix-1
        note: >-
          Official Java verifier (full SHA-256 self+path TreeNode with height-descending
          balance aggregation); logic ported in internal/exchanges/bitunix/merkle. Structurally
          isomorphic to MEXC's Gen-1 Java path validator, but uses full SHA-256 (not truncated)
          and a different leaf formula (encryptUid+nonce+balances JSON).
    integrationNotes: >-
      Public /asset-hub-api/.../queryAuditTimeList + queryAuditInfoByTime expose period ratios
      and merkleRootHash without login. User merkle_tree_bitunix.json download and
      queryUserAuditIdList / verifyUserAsset are login-gated. Recent walletAddress fields are
      empty — Stage 1 walletZip stays unwired. No global ZK / third-party attestation channel.
  - id: woox
    name: WOO X
    porPage: https://woox.io/proof-of-reserves
    dataGuide: docs/woox-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/woo-x/merkle-tree
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@0
        note: >-
          Official Java MerkleCheck against full protobuf tree download + login user hash.
          Not yet ported (tree binaries are ~70–216MB); user hash remains login-gated.
    integrationNotes: >-
      Public /asset/porl/{assets,liabilities} live dashboard (~15 min) and /asset/porl/v2/{audits,snapshot_overview}
      monthly merkle audits are permissionless. Full trees at oss.woo.network/merkle/{auditId}. User Merkle hash
      is login-gated; assets cite custody/CEX venues — Stage 1 ownership/on-chain path is hard. No global ZK.
  - id: toobit
    name: Toobit
    porPage: https://www.toobit.com/proof-of-reserves
    dataGuide: docs/toobit-por-data-guide.md
    vcTier: 1
    upstreamRepos:
      - url: https://github.com/toobit-docs/por-verifier
        role: user_merkle_verifier
        ardmereUse: user-merkle-proof@toobit-1
        note: >-
          Official Go offline verifier for SHA256 Summation Merkle Tree (SMT) with SMT_LEAF /
          SMT_NODE domain separators; logic ported in internal/exchanges/toobit/merkle.
    integrationNotes: >-
      Public bapi.toobit.com/uapi/v1/por/latest-audit exposes period ratios, merkle root, and
      audit history without login. User proof JSON download and /proof-of-reserves/{list,verify,result}
      are login-gated. No public wallet address list or global ZK / third-party attestation channel.
  - id: phemex
    name: Phemex
    porPage: https://phemex.com/proof-of-reserves
    dataGuide: docs/phemex-por-data-guide.md
    vcTier: 1
    upstreamRepos: []
    integrationNotes: >-
      Permissionless https://por.phemex.com/porVersions exposes monthly versionID + chain/cex balances
      (ratios computed). Public PoR UI shows monthly Merkle self-check and Part of Our Cold Wallets,
      but api10 merkle-tree/root and wallet-addresses are CloudFront/auth gated from datacenters; user
      inclusion requires login (hashed client ID). No official OSS Merkle verifier found; no wallet zip.
